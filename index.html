<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">
    <h1>LeetMetrics</h1>

    <div class="user-container">
        <p>Enter your LeetCode username below:</p>
        <div class="user-input-container">
            <input type="text" placeholder="Enter your username here" id="user-input">
            <button id="search-btn">Search</button>
        </div>
    </div>
     
    <div class="stats-container">
        <!-- Fixed progress section HTML -->
<div class="progress">
    <!-- User Profile Header -->
    <div class="user-profile-header">
        <h2 class="username-display" id="username-display">-</h2>
    </div>
    
    <div class="progress-item">
        <div class="progress-ring-container easy-progress">
            <svg class="progress-ring" width="100" height="100">
                <circle class="progress-ring-bg" stroke="#3e4451" stroke-width="8" fill="transparent" r="40" cx="50" cy="50"/>
                <circle class="progress-ring-circle" id="easy-circle" stroke="#98c379" stroke-width="8" fill="transparent" r="40" cx="50" cy="50" stroke-linecap="round"/>
            </svg>
            <div class="progress-text">
                <span id="easy-label">0/0</span>
            </div>
            <div class="difficulty-label easy-label">Easy</div>
        </div>
        <div class="progress-ring-container medium-progress">
            <svg class="progress-ring" width="100" height="100">
                <circle class="progress-ring-bg" stroke="#3e4451" stroke-width="8" fill="transparent" r="40" cx="50" cy="50"/>
                <circle class="progress-ring-circle" id="medium-circle" stroke="#e5c07b" stroke-width="8" fill="transparent" r="40" cx="50" cy="50" stroke-linecap="round"/>
            </svg>
            <div class="progress-text">
                <span id="medium-label">0/0</span>
            </div>
            <div class="difficulty-label medium-label">Medium</div>
        </div>
        <div class="progress-ring-container hard-progress">
            <svg class="progress-ring" width="100" height="100">
                <circle class="progress-ring-bg" stroke="#3e4451" stroke-width="8" fill="transparent" r="40" cx="50" cy="50"/>
                <circle class="progress-ring-circle" id="hard-circle" stroke="#e06c75" stroke-width="8" fill="transparent" r="40" cx="50" cy="50" stroke-linecap="round"/>
            </svg>
            <div class="progress-text">
                <span id="hard-label">0/0</span>
            </div>
            <div class="difficulty-label hard-label">Hard</div>
        </div>
    </div>
    
    <!-- Stats Info Bar -->
    <div class="stats-info-bar">
        <div class="info-item">
            <span class="info-label">Rank</span>
            <span class="info-value" id="rank-value">-</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-item">
            <span class="info-label">Problems Solved</span>
            <span class="info-value" id="solved-value">-</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-item">
            <span class="info-label">Acceptance Rate</span>
            <span class="info-value" id="acceptance-value">-</span>
        </div>
    </div>
</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
